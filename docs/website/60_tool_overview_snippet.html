  <h3>60_オフライン地図作成</h3>
  <p>スタンドアロン環境やインターネット接続が制限されたPCで地図を使うために、ネット環境のあるPCで必要な範囲の国土地理院 淡色地図をあらかじめ保存するツールです。</p>
  <p>地図上で範囲をドラッグして指定し、保存済み地図を <code>ETC\src\tiles\gsi_pale</code> に追加します。ETC2.0アナライザーの各地図画面は、オンライン時は通常どおり国土地理院の地図を使い、オフライン時は保存済み地図を自動で表示します。保存されていない範囲は白地図になります。</p>
