<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>14 エリアビルダー</title>
  <link rel="stylesheet" href="leaflet/leaflet.css">
  <style>
    html, body, #map { height:100%; margin:0; }
    body { font-family:"Meiryo UI", "Segoe UI", sans-serif; }
    .panel {
      position:absolute; z-index:1000; left:14px; top:14px; width:360px;
      background:rgba(255,255,255,.94); border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.18);
      padding:12px; color:#1c2730; max-height:calc(100vh - 52px); overflow:auto;
    }
    h1 { font-size:17px; margin:0 0 4px; }
    .hint { font-size:11px; line-height:1.45; color:#385166; margin:0 0 10px; }
    .row { display:flex; gap:6px; margin:7px 0; align-items:center; flex-wrap:wrap; }
    select, input, button {
      font:inherit; border:1px solid #9eb2c2; border-radius:4px; background:#fff; padding:5px 7px;
    }
    button { cursor:pointer; }
    button.primary { background:#0d6efd; color:white; border-color:#0d6efd; }
    button.warn { background:#fff4df; border-color:#d79d2f; }
    input[type="number"] { width:72px; }
    .status { margin-top:8px; padding:8px; background:#f3f7fa; border:1px solid #d7e2ea; border-radius:6px; font-size:12px; line-height:1.45; }
    .vertex {
      width:12px; height:12px; border:2px solid #fff; border-radius:50%;
      box-shadow:0 1px 5px rgba(0,0,0,.35);
    }
    .official-v { background:#e83e8c; }
    .analysis-v { background:#0d6efd; }
    .leaflet-control-attribution { font-size:10px; }
  </style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>14 エリアビルダー・ゲート設定</h1>
  <p class="hint">クリックで頂点追加。頂点はドラッグで移動、クリックで選択して削除できます。</p>
  <div class="row"><button id="chooseProject">プロジェクトを選択</button></div>
  <p class="hint" id="projectStatus">保存先：プロジェクト内の14_エリアデータ/14_area.geojson</p>
  <div class="row">
    <select id="mode">
      <option value="official">正式区域を編集</option>
      <option value="analysis">分析区域を編集</option>
      <option value="gates">ゲートを追加</option>
    </select>
  </div>
  <div class="row">
    <button id="undo">戻す</button>
    <button id="deleteVertex">選択点・ゲート削除</button>
    <button id="clearLayer" class="warn">現在レイヤをクリア</button>
  </div>
  <div class="row">
    <label>バッファ <input id="buffer" type="number" min="0" step="5" value="30"> m</label>
    <button id="bufferBuild" class="primary">正式区域から分析区域生成</button>
  </div>
  <p class="hint">正式区域の外側へ指定距離だけ広げた分析区域の下書きを作ります。生成後、外周道路を含むように頂点を動かして調整してください。</p>
  <p class="hint">「ゲートを追加」で地図をクリックして出入口を指定します。ドラッグで移動できます。境界上の起終点は最も近い指定ゲートへ割り当てます。</p>
  <div class="row"><select id="gateList" size="4" style="width:100%"></select></div>
  <div class="row"><button id="renameGate">選択ゲートの名前変更</button></div>
  <div class="row">
    <button id="saveGeojson" class="primary">GeoJSON保存</button>
    <button id="loadGeojson">GeoJSON読込</button>
    <input id="fileInput" type="file" accept=".geojson,.json" style="display:none">
  </div>
  <div class="status" id="status"></div>
</div>
<script src="leaflet/leaflet.js"></script>
<script src="offline_map.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
const map = L.map('map', { preferCanvas:true }).setView([35.062, 134.004], 15);
addGsiOfflineLayer(map);

const style = {
  official: { color:'#e83e8c', weight:3, fillColor:'#e83e8c', fillOpacity:.16 },
  analysis: { color:'#0d6efd', weight:3, fillColor:'#0d6efd', fillOpacity:.13 }
};
const state = { official:[], analysis:[], gates:[], nextGateNumber:1, selected:null, history:[], dirty:false };
let nativeBridge = null;
const layers = {
  official: L.layerGroup().addTo(map),
  analysis: L.layerGroup().addTo(map),
  gates: L.layerGroup().addTo(map)
};

function activeMode() { return document.getElementById('mode').value; }
function clonePoints(points) { return points.map(p => ({lat:p.lat, lng:p.lng})); }
function snapshot() {
  state.history.push({ official:clonePoints(state.official), analysis:clonePoints(state.analysis),
                       gates:state.gates.map(g => ({...g})), nextGateNumber:state.nextGateNumber });
  state.dirty = true;
  if (state.history.length > 80) state.history.shift();
}
function setStatus(text) {
  const areaText = name => `${name}: ${state[name].length}点`;
  document.getElementById('status').textContent = `${text}\n${areaText('official')} / ${areaText('analysis')} / ゲート: ${state.gates.length}箇所`;
}
function vertexIcon(mode, selected) {
  return L.divIcon({
    className:'',
    html:`<div class="vertex ${mode}-v" style="${selected ? 'outline:3px solid #111;' : ''}"></div>`,
    iconSize:[16,16],
    iconAnchor:[8,8]
  });
}
function redraw(mode) {
  if (mode === 'gates') return redrawGates();
  layers[mode].clearLayers();
  const points = state[mode];
  if (points.length >= 2) L.polyline(points, style[mode]).addTo(layers[mode]);
  if (points.length >= 3) L.polygon(points, style[mode]).addTo(layers[mode]);
  points.forEach((p, idx) => {
    const marker = L.marker(p, {
      draggable:true,
      icon:vertexIcon(mode, state.selected && state.selected.mode === mode && state.selected.idx === idx)
    }).addTo(layers[mode]);
    marker.on('click', ev => {
      L.DomEvent.stopPropagation(ev);
      state.selected = { mode, idx };
      redraw('official'); redraw('analysis');
    });
    marker.on('dragstart', snapshot);
    marker.on('dragend', ev => { points[idx] = ev.target.getLatLng(); redraw(mode); });
  });
}
function redrawGates() {
  layers.gates.clearLayers();
  const list = document.getElementById('gateList');
  list.replaceChildren();
  state.gates.forEach((gate, idx) => {
    const label = document.createElement('span');
    label.textContent = `${gate.id} ${gate.name}`;
    const marker = L.marker([gate.lat, gate.lng], {draggable:true}).addTo(layers.gates);
    marker.bindTooltip(label, {permanent:true, direction:'top'});
    marker.on('click', ev => {
      L.DomEvent.stopPropagation(ev);
      state.selected = {mode:'gates', idx};
      list.value = gate.id;
    });
    marker.on('dragstart', snapshot);
    marker.on('dragend', ev => {
      const p = ev.target.getLatLng();
      gate.lat = p.lat; gate.lng = p.lng;
      redrawGates();
    });
    const option = new Option(`${gate.id} ${gate.name}`, gate.id);
    list.add(option);
    if (state.selected && state.selected.mode === 'gates' && state.selected.idx === idx) list.value = gate.id;
  });
  if (!state.selected || state.selected.mode !== 'gates') list.selectedIndex = -1;
}
document.getElementById('gateList').onchange = ev => {
  const idx = state.gates.findIndex(g => g.id === ev.target.value);
  if (idx >= 0) { state.selected = {mode:'gates', idx}; map.panTo(state.gates[idx]); }
};
document.getElementById('renameGate').onclick = () => {
  if (!state.selected || state.selected.mode !== 'gates') return setStatus('ゲートを選択してください。');
  const gate = state.gates[state.selected.idx];
  const name = window.prompt(`${gate.id}の名前`, gate.name);
  if (name === null) return;
  snapshot(); gate.name = name.trim(); redrawGates();
};
function redrawAll() {
  redraw('official'); redraw('analysis'); redrawGates();
  setStatus('編集できます。');
}
map.on('click', ev => {
  snapshot();
  if (activeMode() === 'gates') {
    const id = 'G' + String(state.nextGateNumber++).padStart(2, '0');
    state.gates.push({id, name:'', lat:ev.latlng.lat, lng:ev.latlng.lng});
  } else state[activeMode()].push(ev.latlng);
  state.selected = null;
  redraw(activeMode());
  setStatus(activeMode() === 'gates' ? 'ゲートを追加しました。' : '頂点を追加しました。');
});
document.getElementById('undo').onclick = () => {
  const old = state.history.pop();
  if (!old) return setStatus('戻せる操作がありません。');
  state.official = old.official;
  state.analysis = old.analysis;
  state.gates = old.gates;
  state.nextGateNumber = old.nextGateNumber;
  state.selected = null;
  redrawAll();
};
document.getElementById('deleteVertex').onclick = () => {
  if (!state.selected) return setStatus('削除する頂点を選択してください。');
  snapshot();
  state[state.selected.mode].splice(state.selected.idx, 1);
  state.selected = null;
  redrawAll();
};
document.getElementById('clearLayer').onclick = () => {
  snapshot();
  state[activeMode()] = [];
  state.selected = null;
  redrawAll();
};

function mercator(p) {
  const r = 6378137;
  return { x:r * p.lng * Math.PI / 180, y:r * Math.log(Math.tan(Math.PI / 4 + p.lat * Math.PI / 360)) };
}
function lonlat(p) {
  const r = 6378137;
  return L.latLng((2 * Math.atan(Math.exp(p.y / r)) - Math.PI / 2) * 180 / Math.PI, p.x / r * 180 / Math.PI);
}
function centroid(points) {
  const ms = points.map(mercator);
  return {
    x: ms.reduce((a,p) => a + p.x, 0) / ms.length,
    y: ms.reduce((a,p) => a + p.y, 0) / ms.length
  };
}
document.getElementById('bufferBuild').onclick = () => {
  if (state.official.length < 3) return setStatus('正式区域を3点以上で作成してください。');
  snapshot();
  const d = Number(document.getElementById('buffer').value || 0);
  const c = centroid(state.official);
  state.analysis = state.official.map(p => {
    const m = mercator(p);
    const vx = m.x - c.x, vy = m.y - c.y;
    const len = Math.hypot(vx, vy) || 1;
    return lonlat({ x:m.x + vx / len * d, y:m.y + vy / len * d });
  });
  redrawAll();
  setStatus('分析区域を生成しました。必要に応じて頂点を調整してください。');
};

function selfIntersects(points) {
  function ccw(a,b,c) { return (c.lat-a.lat)*(b.lng-a.lng) > (b.lat-a.lat)*(c.lng-a.lng); }
  function hit(a,b,c,d) { return ccw(a,c,d) !== ccw(b,c,d) && ccw(a,b,c) !== ccw(a,b,d); }
  for (let i=0; i<points.length; i++) {
    const a = points[i], b = points[(i+1)%points.length];
    for (let j=i+1; j<points.length; j++) {
      if (Math.abs(i-j) <= 1 || (i === 0 && j === points.length - 1)) continue;
      if (hit(a, b, points[j], points[(j+1)%points.length])) return true;
    }
  }
  return false;
}
function validate() {
  if (state.official.length < 3) return '正式区域が3点未満です。';
  if (state.analysis.length < 3) return '分析区域が3点未満です。';
  if (selfIntersects(state.official)) return '正式区域が自己交差しています。';
  if (selfIntersects(state.analysis)) return '分析区域が自己交差しています。';
  if (!state.gates.length) return 'ゲートを1箇所以上指定してください。';
  return '';
}
function ring(points) {
  const coords = points.map(p => [Number(p.lng.toFixed(9)), Number(p.lat.toFixed(9))]);
  if (coords.length) coords.push(coords[0]);
  return coords;
}
function toGeoJSON() {
  const err = validate();
  if (err) throw new Error(err);
  return {
    type:'FeatureCollection',
    metadata:{ tool:'14_area_builder', gate_assignment:'nearest_manual_gate', next_gate_number:state.nextGateNumber, saved_at:new Date().toISOString() },
    features:[
      { type:'Feature', properties:{ area14_role:'official_area', name:'正式区域' }, geometry:{ type:'Polygon', coordinates:[ring(state.official)] } },
      { type:'Feature', properties:{ area14_role:'analysis_area', name:'分析区域' }, geometry:{ type:'Polygon', coordinates:[ring(state.analysis)] } },
      ...state.gates.map(g => ({type:'Feature', properties:{area14_role:'gate', gate_id:g.id, name:g.name},
                              geometry:{type:'Point', coordinates:[g.lng, g.lat]}}))
    ]
  };
}
function loadFeatureCollection(data) {
  const next = { official:[], analysis:[], gates:[] };
  (data.features || []).forEach(f => {
    const role = ((f.properties || {}).area14_role || (f.properties || {}).area15_role || (f.properties || {}).role || '').toLowerCase();
    const geom = f.geometry || {};
    if (role === 'gate') {
      const id = String((f.properties || {}).gate_id || '');
      if (!/^G[0-9]+$/.test(id) || next.gates.some(g => g.id === id) || geom.type !== 'Point' || !geom.coordinates || geom.coordinates.length !== 2 ||
          !geom.coordinates.every(Number.isFinite)) throw new Error('ゲート番号または座標が不正です。');
      next.gates.push({id, name:String(f.properties.name || ''), lng:geom.coordinates[0], lat:geom.coordinates[1]});
      return;
    }
    if (['official_area', 'analysis_area'].includes(role) && (geom.type !== 'Polygon' || geom.coordinates.length !== 1 || next[role === 'official_area' ? 'official' : 'analysis'].length))
      throw new Error('この編集画面は各区域1つのPolygonに対応します。複数区域や穴のあるデータは読み込めません。');
    if (!['official_area', 'analysis_area'].includes(role) || geom.type !== 'Polygon') return;
    const points = (geom.coordinates[0] || []).slice();
    if (points.length && points[0][0] === points[points.length - 1][0] && points[0][1] === points[points.length - 1][1]) points.pop();
    next[role === 'official_area' ? 'official' : 'analysis'] = points.map(c => L.latLng(c[1], c[0]));
  });
  snapshot();
  state.official = next.official;
  state.analysis = next.analysis;
  state.gates = next.gates;
  state.nextGateNumber = Math.max(1, Number((data.metadata || {}).next_gate_number) || 1, ...next.gates.map(g => Number(g.id.slice(1)) + 1));
  state.selected = null;
  redrawAll();
  const bounds = L.latLngBounds([...state.official, ...state.analysis]);
  if (bounds.isValid()) map.fitBounds(bounds.pad(.15));
}
function nativeCall(method, ...args) {
  if (!nativeBridge) return Promise.reject(new Error('14_area_builder.batから起動してプロジェクトを選択してください。'));
  return new Promise((resolve, reject) => nativeBridge[method](...args, raw => {
    const result = JSON.parse(raw);
    if (result.ok) resolve(result); else reject(new Error(result.error));
  }));
}
let projectSelected = false;
function applyProject(result) {
  if (result.cancelled) return;
  document.getElementById('saveGeojson').disabled = true;
  projectSelected = Boolean(result.project);
  if (!projectSelected) {
    document.getElementById('projectStatus').textContent = 'プロジェクト未選択';
    setStatus('「プロジェクトを選択」から作業するフォルダを指定してください。');
    return;
  }
  document.getElementById('projectStatus').textContent = result.path;
  loadFeatureCollection(result.data || {features:[]});
  state.history = []; state.dirty = false;
  document.getElementById('saveGeojson').disabled = false;
  setStatus(result.data ? 'プロジェクトの区域・ゲートを読み込みました。' : '区域とゲートを作成してください。');
}
document.getElementById('chooseProject').onclick = async () => {
  if (state.dirty && !window.confirm('未保存の編集を破棄してプロジェクトを切り替えますか？')) return;
  try { applyProject(await nativeCall('chooseProject')); }
  catch (err) { setStatus(err.message); }
};
document.getElementById('saveGeojson').onclick = async () => {
  try {
    const result = await nativeCall('saveArea', JSON.stringify(toGeoJSON()));
    document.getElementById('projectStatus').textContent = result.path;
    state.dirty = false;
    setStatus('区域と指定ゲートをプロジェクトへ保存しました。');
  } catch (err) {
    if (err.name !== 'AbortError') setStatus(err.message);
  }
};
document.getElementById('loadGeojson').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = ev => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      loadFeatureCollection(JSON.parse(reader.result));
      document.getElementById('saveGeojson').disabled = !nativeBridge || !projectSelected;
      setStatus('GeoJSONを読み込みました。保存すると選択中のプロジェクトへ反映します。');
    }
    catch (err) { setStatus('GeoJSON読込エラー: ' + err.message); }
  };
  reader.readAsText(file);
};
redrawAll();
document.getElementById('saveGeojson').disabled = true;
if (typeof qt !== 'undefined' && typeof QWebChannel !== 'undefined') {
  new QWebChannel(qt.webChannelTransport, channel => {
    nativeBridge = channel.objects.areaBridge;
    nativeCall('getProject').then(applyProject).catch(err => setStatus(err.message));
  });
} else setStatus('14_area_builder.batから起動してください。プロジェクト選択と保存はPythonが行います。');
</script>
</body>
</html>
