<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>15 エリア・ゲート設定</title>
  <link rel="stylesheet" href="leaflet/leaflet.css">
  <script src="leaflet/leaflet.js"></script>
  <style>
    html, body, #map { height:100%; margin:0; font-family:"Meiryo UI","Segoe UI",sans-serif; }
    .toolbar { position:absolute; top:10px; left:10px; z-index:1000; width:360px; max-height:calc(100vh - 20px); overflow:auto; background:#fffffff2; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-shadow:0 8px 24px #0003; }
    .row { display:flex; gap:6px; align-items:center; margin:4px 0; }
    button, select, input { font:inherit; }
    button { border:1px solid #64748b; background:#f8fafc; border-radius:4px; padding:5px 8px; cursor:pointer; }
    button:hover { background:#e2e8f0; }
    input[type="number"], input[type="text"] { border:1px solid #94a3b8; border-radius:4px; padding:4px; }
    input.wide { flex:1; min-width:0; }
    .hint { font-size:12px; color:#475569; line-height:1.45; }
    .status { white-space:pre-wrap; font-size:12px; color:#0f172a; background:#f8fafc; border:1px solid #e2e8f0; padding:6px; border-radius:4px; }
    .list { max-height:130px; overflow:auto; border:1px solid #e2e8f0; background:#fff; margin-top:4px; }
    .item { display:flex; justify-content:space-between; gap:6px; align-items:center; padding:3px 5px; border-bottom:1px solid #f1f5f9; font-size:12px; }
    .item span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .section { border-top:1px solid #e2e8f0; margin-top:8px; padding-top:8px; }
    .marker-label { font-weight:700; color:#111827; text-shadow:0 1px 2px #fff; }
    .vertex-icon { width:10px; height:10px; border:2px solid #fff; border-radius:50%; box-shadow:0 1px 4px #0007; }
  </style>
</head>
<body>
<div id="map"></div>
<div class="toolbar">
  <strong>15 エリア・ゲート設定</strong>
  <div class="hint">クリックで頂点追加。マーカーをドラッグして移動。頂点クリックで選択、削除ボタンで削除。</div>
  <div class="row">
    <select id="mode">
      <option value="official">正式区域を編集</option>
      <option value="analysis">分析区域を編集</option>
      <option value="gate_point">点ゲートを追加</option>
      <option value="gate_line">線ゲートを追加</option>
      <option value="old_road">旧出雲街道ラインを編集</option>
    </select>
  </div>
  <div class="row">
    <button id="undo">戻す</button>
    <button id="deleteVertex">選択頂点削除</button>
    <button id="clearCurrent">現在レイヤをクリア</button>
  </div>
  <div class="section">
    <div class="row">
      <label>バッファ</label>
      <input id="bufferM" type="number" value="30" min="0" max="500" step="1" style="width:70px">
      <button id="makeBuffer">正式区域から分析区域生成</button>
    </div>
    <div class="hint">Web Mercator(EPSG:3857)へ投影し、メートル単位で外側へ広げます。生成後は手作業で修正できます。</div>
  </div>
  <div class="section">
    <div class="row"><input id="gateId" class="wide" type="text" placeholder="ゲートID"><input id="gateName" class="wide" type="text" placeholder="ゲート名称"></div>
    <div class="row"><input id="gateNote" class="wide" type="text" placeholder="備考"><button id="finishGateLine">線ゲート確定</button></div>
    <div class="hint">点ゲートはクリック時に登録。線ゲートは2点以上クリックして確定します。ID重複は保存時に警告します。</div>
  </div>
  <div class="section">
    <div class="row">
      <button id="validate">妥当性確認</button>
      <button id="save">GeoJSON保存</button>
      <button id="loadBtn">GeoJSON読込</button>
    </div>
    <input type="file" id="fileInput" accept=".geojson,.json" style="display:none">
    <div class="row">
      <button id="saveLocal">前回設定として保存</button>
      <button id="loadLocal">前回設定を読込</button>
    </div>
  </div>
  <div class="section">
    <strong>ゲート一覧</strong>
    <div id="gateList" class="list"></div>
  </div>
  <div id="status" class="status">正式区域: 0点
分析区域: 0点
ゲート: 0件</div>
</div>
<script>
const map = L.map('map').setView([35.069095, 134.004512], 14);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxZoom:18,
  attribution:'地理院タイル'
}).addTo(map);

const state = { official:[], analysis:[], oldRoad:[], gates:[], gateDraft:[], selected:null, history:[] };
const layers = { official:L.layerGroup().addTo(map), analysis:L.layerGroup().addTo(map), oldRoad:L.layerGroup().addTo(map), gates:L.layerGroup().addTo(map), draft:L.layerGroup().addTo(map) };
const colors = { official:'#2563eb', analysis:'#dc2626', oldRoad:'#7c3aed' };

function cloneState() { return JSON.parse(JSON.stringify({official:state.official, analysis:state.analysis, oldRoad:state.oldRoad, gates:state.gates, gateDraft:state.gateDraft})); }
function pushHistory() { state.history.push(cloneState()); if (state.history.length > 100) state.history.shift(); }
function restore(snapshot) { state.official=snapshot.official||[]; state.analysis=snapshot.analysis||[]; state.oldRoad=snapshot.oldRoad||[]; state.gates=snapshot.gates||[]; state.gateDraft=snapshot.gateDraft||[]; state.selected=null; redraw(); }
function mode() { return document.getElementById('mode').value; }
function asLatLng(pt) { return [pt.lat, pt.lon]; }
function selectedArray() { const m=mode(); if (m==='official') return state.official; if (m==='analysis') return state.analysis; if (m==='old_road') return state.oldRoad; if (m==='gate_line') return state.gateDraft; return null; }
function setStatus(text) { document.getElementById('status').textContent = text || `正式区域: ${state.official.length}点\n分析区域: ${state.analysis.length}点\nゲート: ${state.gates.length}件\n旧出雲街道: ${state.oldRoad.length}点`; }

function markerFor(pt, role, idx) {
  const color = colors[role] || '#111';
  const icon = L.divIcon({className:'', html:`<div class="vertex-icon" style="background:${color}"></div>`, iconSize:[14,14], iconAnchor:[7,7]});
  const marker = L.marker(asLatLng(pt), {icon, draggable:true});
  marker.on('click', e => { L.DomEvent.stopPropagation(e); state.selected={role, idx}; setStatus(`選択中: ${role} #${idx+1}`); });
  marker.on('dragstart', () => pushHistory());
  marker.on('dragend', e => { const arr = role==='official'?state.official:role==='analysis'?state.analysis:role==='oldRoad'?state.oldRoad:state.gateDraft; arr[idx]={lat:e.target.getLatLng().lat, lon:e.target.getLatLng().lng}; redraw(); });
  return marker;
}

function redraw(updateStatus=true) {
  Object.values(layers).forEach(g => g.clearLayers());
  drawPolygon('official', state.official, layers.official, colors.official, '正式区域');
  drawPolygon('analysis', state.analysis, layers.analysis, colors.analysis, '分析区域');
  if (state.oldRoad.length) L.polyline(state.oldRoad.map(asLatLng), {color:colors.oldRoad, weight:5, opacity:.85}).bindTooltip('旧出雲街道').addTo(layers.oldRoad);
  state.oldRoad.forEach((pt,i)=>markerFor(pt,'oldRoad',i).addTo(layers.oldRoad));
  state.gates.forEach((g, gi) => {
    if (g.geometry.type === 'Point') {
      const c = g.geometry.coordinates;
      L.marker([c[1], c[0]], {draggable:true}).bindTooltip(`${g.properties.gate_id} ${g.properties.name||''}`, {permanent:false, className:'marker-label'})
        .on('dragend', e => { pushHistory(); g.geometry.coordinates=[e.target.getLatLng().lng, e.target.getLatLng().lat]; redraw(); }).addTo(layers.gates);
    } else {
      L.polyline(g.geometry.coordinates.map(c=>[c[1],c[0]]), {color:'#16a34a', weight:5}).bindTooltip(`${g.properties.gate_id} ${g.properties.name||''}`).addTo(layers.gates);
    }
  });
  if (state.gateDraft.length) {
    L.polyline(state.gateDraft.map(asLatLng), {color:'#16a34a', weight:4, dashArray:'4 4'}).addTo(layers.draft);
    state.gateDraft.forEach((pt,i)=>markerFor(pt,'gateDraft',i).addTo(layers.draft));
  }
  renderGateList();
  if (updateStatus) setStatus();
}

function drawPolygon(role, pts, layer, color, name) {
  if (pts.length >= 3) L.polygon(pts.map(asLatLng), {color, weight:3, fillOpacity:.12}).bindTooltip(name).addTo(layer);
  if (pts.length >= 2) L.polyline(pts.map(asLatLng), {color, weight:2, dashArray: pts.length < 3 ? '4 4' : null}).addTo(layer);
  pts.forEach((pt,i)=>markerFor(pt,role,i).addTo(layer));
}

map.on('click', e => {
  const m = mode();
  pushHistory();
  if (m === 'gate_point') {
    const gate = buildGate('Point', [e.latlng]);
    if (!gate) return;
    state.gates.push(gate);
  } else {
    const arr = selectedArray();
    if (arr) arr.push({lat:e.latlng.lat, lon:e.latlng.lng});
  }
  redraw();
});

function buildGate(type, latlngs) {
  const id = document.getElementById('gateId').value.trim();
  if (!id) { alert('ゲートIDを入力してください。'); return null; }
  if (state.gates.some(g => g.properties.gate_id === id)) { alert('ゲートIDが重複しています。'); return null; }
  const props = { area15_role:'gate', gate_id:id, name:document.getElementById('gateName').value.trim(), note:document.getElementById('gateNote').value.trim() };
  if (type === 'Point') return { type:'Feature', properties:props, geometry:{type:'Point', coordinates:[latlngs[0].lng, latlngs[0].lat]} };
  return { type:'Feature', properties:props, geometry:{type:'LineString', coordinates:latlngs.map(p=>[p.lon ?? p.lng, p.lat])} };
}

document.getElementById('finishGateLine').onclick = () => {
  if (state.gateDraft.length < 2) { alert('線ゲートは2点以上必要です。'); return; }
  pushHistory();
  const gate = buildGate('LineString', state.gateDraft);
  if (gate) { state.gates.push(gate); state.gateDraft=[]; redraw(); }
};
document.getElementById('undo').onclick = () => { const s = state.history.pop(); if (s) restore(s); };
document.getElementById('deleteVertex').onclick = () => {
  if (!state.selected) return;
  pushHistory();
  const role = state.selected.role;
  const arr = role==='official'?state.official:role==='analysis'?state.analysis:role==='oldRoad'?state.oldRoad:role==='gateDraft'?state.gateDraft:null;
  if (arr) arr.splice(state.selected.idx, 1);
  state.selected=null; redraw();
};
document.getElementById('clearCurrent').onclick = () => {
  pushHistory();
  const m = mode();
  if (m==='official') state.official=[]; else if (m==='analysis') state.analysis=[]; else if (m==='old_road') state.oldRoad=[]; else if (m==='gate_line') state.gateDraft=[];
  redraw();
};

function merc(pt) { const r=6378137, x=r*pt.lon*Math.PI/180, y=r*Math.log(Math.tan(Math.PI/4+pt.lat*Math.PI/360)); return {x,y}; }
function lonlat(p) { const r=6378137, lon=p.x/r*180/Math.PI, lat=(2*Math.atan(Math.exp(p.y/r))-Math.PI/2)*180/Math.PI; return {lat, lon}; }
function signedArea(pts) { let a=0; for(let i=0;i<pts.length;i++){const p=pts[i], q=pts[(i+1)%pts.length]; a += p.x*q.y - q.x*p.y;} return a/2; }
function lineIntersection(p1,p2,p3,p4) {
  const a1=p2.y-p1.y, b1=p1.x-p2.x, c1=a1*p1.x+b1*p1.y;
  const a2=p4.y-p3.y, b2=p3.x-p4.x, c2=a2*p3.x+b2*p3.y;
  const d=a1*b2-a2*b1; if (Math.abs(d)<1e-9) return null;
  return {x:(b2*c1-b1*c2)/d, y:(a1*c2-a2*c1)/d};
}
function offsetPolygon(points, meters) {
  if (points.length < 3 || meters === 0) return points.slice();
  const pts = points.map(merc);
  const ccw = signedArea(pts) > 0;
  const lines = [];
  for (let i=0;i<pts.length;i++) {
    const a=pts[i], b=pts[(i+1)%pts.length], dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const nx = ccw ? dy/len : -dy/len, ny = ccw ? -dx/len : dx/len;
    lines.push([{x:a.x+nx*meters,y:a.y+ny*meters},{x:b.x+nx*meters,y:b.y+ny*meters}]);
  }
  const out = [];
  for (let i=0;i<lines.length;i++) {
    const prev=lines[(i-1+lines.length)%lines.length], cur=lines[i];
    out.push(lonlat(lineIntersection(prev[0],prev[1],cur[0],cur[1]) || cur[0]));
  }
  return out;
}
document.getElementById('makeBuffer').onclick = () => {
  if (state.official.length < 3) { alert('先に正式区域を作成してください。'); return; }
  pushHistory();
  state.analysis = offsetPolygon(state.official, Number(document.getElementById('bufferM').value || 30));
  redraw();
};

function segmentsIntersect(a,b,c,d) {
  function orient(p,q,r){ const v=(q.lon-p.lon)*(r.lat-p.lat)-(q.lat-p.lat)*(r.lon-p.lon); return Math.abs(v)<1e-12?0:(v>0?1:-1); }
  const o1=orient(a,b,c), o2=orient(a,b,d), o3=orient(c,d,a), o4=orient(c,d,b);
  return o1*o2<0 && o3*o4<0;
}
function validatePoly(name, pts, messages) {
  if (pts.length < 3) { messages.push(`${name}: 3点以上必要です。`); return; }
  for (let i=0;i<pts.length;i++) for (let j=i+1;j<pts.length;j++) {
    if (Math.abs(i-j)<=1 || (i===0 && j===pts.length-1)) continue;
    if (segmentsIntersect(pts[i], pts[(i+1)%pts.length], pts[j], pts[(j+1)%pts.length])) messages.push(`${name}: 自己交差があります。`);
  }
}
function validateAll() {
  const messages=[];
  validatePoly('正式区域', state.official, messages);
  validatePoly('分析区域', state.analysis, messages);
  const seen = new Set();
  state.gates.forEach(g => { const id=g.properties.gate_id; if(!id) messages.push('ゲートIDが空です。'); if(seen.has(id)) messages.push(`ゲートID重複: ${id}`); seen.add(id); });
  if (!messages.length) messages.push('妥当性確認OKです。');
  setStatus(messages.join('\n'));
  return messages.length === 1 && messages[0].includes('OK');
}
document.getElementById('validate').onclick = validateAll;

function polygonFeature(role, name, pts) {
  return { type:'Feature', properties:{area15_role:role, name}, geometry:{type:'Polygon', coordinates:[pts.concat([pts[0]]).map(p=>[p.lon,p.lat])]} };
}
function buildGeoJSON() {
  const features = [];
  if (state.official.length >= 3) features.push(polygonFeature('official_area', '正式区域', state.official));
  if (state.analysis.length >= 3) features.push(polygonFeature('analysis_area', '分析区域', state.analysis));
  features.push(...state.gates);
  if (state.oldRoad.length >= 2) features.push({ type:'Feature', properties:{area15_role:'old_izumo_kaido', name:'旧出雲街道'}, geometry:{type:'LineString', coordinates:state.oldRoad.map(p=>[p.lon,p.lat])} });
  return { type:'FeatureCollection', metadata:{tool:'15_area_gate_builder', crs:'EPSG:4326', analysis_buffer_m:Number(document.getElementById('bufferM').value||30)}, features };
}
function loadGeoJSON(data) {
  pushHistory(); state.official=[]; state.analysis=[]; state.oldRoad=[]; state.gates=[]; state.gateDraft=[];
  (data.features||[]).forEach(f => {
    const role = (f.properties && (f.properties.area15_role || f.properties.role || f.properties.type) || '').toLowerCase();
    const g = f.geometry || {};
    if (role === 'official_area' && g.type === 'Polygon') state.official = (g.coordinates[0]||[]).slice(0,-1).map(c=>({lon:c[0], lat:c[1]}));
    else if (role === 'analysis_area' && g.type === 'Polygon') state.analysis = (g.coordinates[0]||[]).slice(0,-1).map(c=>({lon:c[0], lat:c[1]}));
    else if (role === 'gate') state.gates.push(f);
    else if (role === 'old_izumo_kaido' && g.type === 'LineString') state.oldRoad = (g.coordinates||[]).map(c=>({lon:c[0], lat:c[1]}));
  });
  redraw();
  const pts = state.analysis.length ? state.analysis : state.official;
  if (pts.length) map.fitBounds(pts.map(asLatLng), {padding:[24,24]});
}
document.getElementById('save').onclick = () => {
  if (!validateAll()) { if (!confirm('警告があります。このまま保存しますか？')) return; }
  const blob = new Blob([JSON.stringify(buildGeoJSON(), null, 2)], {type:'application/geo+json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='15_area_gate.geojson'; a.click(); URL.revokeObjectURL(url);
};
document.getElementById('loadBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { try { loadGeoJSON(JSON.parse(ev.target.result)); } catch(err) { alert('GeoJSON読込に失敗しました: '+err); } };
  reader.readAsText(file, 'utf-8');
};
document.getElementById('saveLocal').onclick = () => { localStorage.setItem('area15GeoJSON', JSON.stringify(buildGeoJSON())); setStatus('前回設定としてブラウザに保存しました。'); };
document.getElementById('loadLocal').onclick = () => { const s=localStorage.getItem('area15GeoJSON'); if(!s) alert('前回設定がありません。'); else loadGeoJSON(JSON.parse(s)); };

function renderGateList() {
  const list = document.getElementById('gateList'); list.innerHTML='';
  state.gates.forEach((g,i) => {
    const row=document.createElement('div'); row.className='item';
    const span=document.createElement('span'); span.textContent=`${g.properties.gate_id} ${g.properties.name||''}`;
    const del=document.createElement('button'); del.textContent='削除'; del.onclick=()=>{ pushHistory(); state.gates.splice(i,1); redraw(); };
    row.appendChild(span); row.appendChild(del); list.appendChild(row);
  });
}
redraw();
</script>
</body>
</html>
